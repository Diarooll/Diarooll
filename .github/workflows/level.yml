name: Update GitHub level card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/level.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/level.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/level.svg
          git diff --cached --quiet || (git commit -m "chore: update level card" && git push)
